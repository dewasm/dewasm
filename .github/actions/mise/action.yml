name: Install tools through mise
description: >
  Installs every tool at the versions mise.toml and mise.lock state.
  Every job installs the same tools, so all jobs share one cache of them.
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      with:
        version: 2026.10.1
