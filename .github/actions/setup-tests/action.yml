name: Set up test environment
description: >
  Everything `cargo test` needs beyond a checkout with submodules (the ADR-15
  fail-loud requirements from docs/testing.md): the backend
  interpreters/compilers, the fetch.sh build tools, the Rust build cache, and
  the examples/apps cache.

inputs:
  rust-cache-shared-key:
    description: Swatinem/rust-cache shared-key
    default: tests
  rust-cache-save-if:
    description: Whether this job may save the Rust build cache
    default: 'true'

runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@v1 # runner ruby is 3.2; the suite needs >= 3.4
      with:
        ruby-version: '3.4'
    - uses: actions/setup-go@v5 # runner go would do (>= 1.18); pinned for stability
      with:
        go-version: stable
        cache: false # no go.mod in this repo
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: mlugg/setup-zig@v2
      with:
        version: 0.16.0 # keep in sync with local dev

    - name: Install fetch.sh build tools (binaryen, bison, flex)
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends binaryen bison flex

    - name: Add wasm32-wasip1 target (fetch.sh builds ripgrep with it)
      shell: bash
      run: rustup target add wasm32-wasip1

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.rust-cache-shared-key }}
        save-if: ${{ inputs.rust-cache-save-if }}

    # The libpcap/tree-sitter/ripgrep stamps in fetch.sh fold in
    # `wasm-opt --version`, so the apps-cache key must too: a binaryen bump
    # must yield a new key so the rebuilt artifacts get re-saved.
    - name: Compute apps cache key component
      id: appskey
      shell: bash
      run: echo "wasmopt=$(wasm-opt --version | awk '{print $3}')" >> "$GITHUB_OUTPUT"

    - name: Restore examples/apps cache
      uses: actions/cache@v4
      with:
        path: examples/apps/cache
        key: apps-v1-${{ runner.os }}-wasmopt${{ steps.appskey.outputs.wasmopt }}-${{ hashFiles('examples/apps/fetch.sh', 'examples/apps/src/**') }}
        # fetch.sh is stamp-driven and incremental, so a stale restore is
        # still a win: only re-pinned apps are refetched/rebuilt.
        restore-keys: |
          apps-v1-${{ runner.os }}-wasmopt${{ steps.appskey.outputs.wasmopt }}-
          apps-v1-${{ runner.os }}-

    - name: Populate apps cache (no-op on full cache hit)
      shell: bash
      run: examples/apps/fetch.sh
