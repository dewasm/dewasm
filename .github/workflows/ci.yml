name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every other job waits for this one.
  # It fills the two caches they read: the tools of `mise.toml`, and the apps.
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      key: ${{ steps.appskey.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      # `setup.sh` builds the C apps with `wasi-sdk`, which it finds through `WASI_SDK_PATH`.
      # The action passes that variable on from the `[env]` table of `mise.toml`.
      # The sqlite3-mod build needs `wasm-opt`'s `--no-inline`.
      # Ubuntu's packaged Binaryen is older than that flag.
      - uses: ./.github/actions/mise
      - name: Install setup.sh build tools (bison, flex)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison flex
      - name: Add wasm32-wasip1 target (setup.sh builds ripgrep with it)
        run: rustup target add wasm32-wasip1
      # The `libpcap`/`tree-sitter`/`ripgrep` stamps in `setup.sh` fold in `wasm-opt --version`.
      # So the apps-cache key must too: a new Binaryen version must yield a new key.
      # The rebuilt artifacts then get re-saved.
      # Same for the `ruby-packed` stamp and `wasi-vfs --version`.
      - name: Compute apps cache key
        id: appskey
        run: echo "key=apps-v1-${{ runner.os }}-wasmopt$(wasm-opt --version | awk '{print $3}')-wasivfs$(wasi-vfs --version | awk '{print $2}')-${{ hashFiles('examples/apps/setup.sh', 'examples/apps/scripts/**', 'examples/apps/src/**') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: examples/apps/cache
          key: ${{ steps.appskey.outputs.key }}
          restore-keys: |
            apps-v1-${{ runner.os }}-
      - name: Populate apps cache (no-op on full cache hit)
        run: examples/apps/setup.sh

  lint:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7 # no submodules: fmt, clippy, and the text check don't read them
      - uses: ./.github/actions/mise
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The writing style rules that a program can check.
      # The vocabulary check reads two word lists, which its `setup.sh` fetches by sha256.
      - uses: actions/cache@v6
        with:
          path: crates/xtask-text-check/cache
          key: word-lists-${{ hashFiles('crates/xtask-text-check/setup.sh') }}
      - run: crates/xtask-text-check/setup.sh
      - run: cargo test -p xtask-text-check
      - run: git ls-files '*.sh' | grep -v '^crates/dewasm-backend-bash/units/' | xargs shellcheck -x

  test:
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        backend: [ruby, bash, python, go, java, perl, codon]
    runs-on: ubuntu-latest
    # The `slow_test` run (full specification suites + slow apps) has unmeasured wall time.
    # Give it a wide margin and tighten later.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 60 || 300 }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # Bash and Perl come with the runner; `mise` provides every other backend's tools.
      - uses: ./.github/actions/mise
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.backend }}
          # Only main writes the shared build cache.
          # PRs restore it read-only to keep the repository under the 10 GB cache budget.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache/restore@v6
        with:
          path: examples/apps/cache
          key: ${{ needs.setup.outputs.key }}
          fail-on-cache-miss: true
      - name: Test
        if: github.event_name == 'pull_request'
        run: cargo test -p dewasm-backend-${{ matrix.backend }} --no-fail-fast
      # Speed categories: the `slow_test` feature is CI's main run.
      # It runs the full specification suite plus the slow per-case app cases.
      # It deliberately excludes the `ultra_slow_test` cases, which run only locally.
      # Those are the pseudo-terminal and giant-`go build` cases, which take about 1 minute or more.
      # They timed out (#22) or exhausted runner memory (#23).
      - name: Test (slow)
        if: github.event_name != 'pull_request'
        run: cargo test -p dewasm-backend-${{ matrix.backend }} --no-fail-fast --features dewasm-backend-${{ matrix.backend }}/slow_test

  core:
    needs: setup
    runs-on: ubuntu-latest
    # The `slow_test` run (full specification suites + slow apps) has unmeasured wall time.
    # Give it a wide margin and tighten later.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 60 || 300 }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # dewasm holds the cross-backend tests, so this job needs every backend toolchain.
      # Bash and Perl come with the runner.
      - uses: ./.github/actions/mise
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core
          # Only main writes the shared build cache.
          # PRs restore it read-only to keep the repository under the 10 GB cache budget.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache/restore@v6
        with:
          path: examples/apps/cache
          key: ${{ needs.setup.outputs.key }}
          fail-on-cache-miss: true
      # Speed categories: the `slow_test` feature covers the slow cases.
      # `dewasm-test-helper/wasmtime_test` runs the `apps_wasmtime` snapshot-freshness suite.
      # That suite runs the `xtask` binary, which embeds the `wasmtime` crate at a fixed version.
      # So nothing is installed for it.
      # The suite never builds the binary, hence the explicit build step below.
      # `dewasm/slow_test` runs the slow cross-backend `--data-file` real-app cases.
      - name: Build the snapshot runner
        if: github.event_name != 'pull_request'
        run: cargo build -p xtask
      - name: Test
        if: github.event_name == 'pull_request'
        run: cargo test -p dewasm-core -p dewasm-backend -p dewasm -p dewasm-test-helper -p xtask -p xtask-feature-audit -p xtask-records -p xtask-snapshot -p xtask-support-docs --no-fail-fast
      - name: Test (slow)
        if: github.event_name != 'pull_request'
        run: cargo test -p dewasm-core -p dewasm-backend -p dewasm -p dewasm-test-helper -p xtask -p xtask-feature-audit -p xtask-records -p xtask-snapshot -p xtask-support-docs --no-fail-fast --features dewasm/slow_test,dewasm-test-helper/wasmtime_test
