name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7 # no submodules: fmt/clippy don't read them
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: git ls-files '*.sh' | grep -v '^crates/dewasm-backend-bash/units/' | xargs shellcheck -x

  apps-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      key: ${{ steps.appskey.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - name: Install wasi-sdk (setup.sh builds the C apps with it)
        # keep in sync with local dev (docs/testing.md names the version)
        run: |
          curl -fsSL --retry 5 -o /tmp/wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          echo "b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4  /tmp/wasi-sdk.tar.gz" | shasum -a 256 -c -
          sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt
          echo "WASI_SDK_PATH=/opt/wasi-sdk-34.0-x86_64-linux" >> "$GITHUB_ENV"
      - name: Install setup.sh build tools (binaryen, bison, flex)
        # Binaryen comes from the pinned upstream release, not apt: the sqlite3-mod build needs wasm-opt's --no-inline, which Ubuntu's packaged binaryen predates.
        # keep in sync with local dev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison flex
          curl -sSfL -o /tmp/binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz
          tar -xzf /tmp/binaryen.tar.gz -C /tmp
          sudo cp /tmp/binaryen-version_132/bin/* /usr/local/bin/
      - name: Add wasm32-wasip1 target (setup.sh builds ripgrep with it)
        run: rustup target add wasm32-wasip1
      - name: Install wasi-vfs CLI (setup.sh packs ruby-packed with it)
        run: |
          curl -fsSL --retry 5 -o /tmp/wasi-vfs-cli.zip \
            https://github.com/kateinoigakukun/wasi-vfs/releases/download/v0.6.3/wasi-vfs-cli-x86_64-unknown-linux-gnu.zip
          echo "c9ee8179f6f0882abc37024fbe0cd678311aa8a29083fa364915ed4d29a69485  /tmp/wasi-vfs-cli.zip" | shasum -a 256 -c -
          sudo unzip -o /tmp/wasi-vfs-cli.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/wasi-vfs
      # The libpcap/tree-sitter/ripgrep stamps in setup.sh fold in
      # `wasm-opt --version`, so the apps-cache key must too: a binaryen bump must yield a new key so the rebuilt artifacts get re-saved.
      # Same for the ruby-packed stamp and `wasi-vfs --version`.
      - name: Compute apps cache key
        id: appskey
        run: echo "key=apps-v1-${{ runner.os }}-wasmopt$(wasm-opt --version | awk '{print $3}')-wasivfs$(wasi-vfs --version | awk '{print $2}')-${{ hashFiles('examples/apps/setup.sh', 'examples/apps/scripts/**', 'examples/apps/src/**') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: examples/apps/cache
          key: ${{ steps.appskey.outputs.key }}
          restore-keys: |
            apps-v1-${{ runner.os }}-
      - name: Populate apps cache (no-op on full cache hit)
        run: examples/apps/setup.sh

  test:
    needs: apps-cache
    strategy:
      fail-fast: false
      matrix:
        backend: [ruby, bash, python, go, java, perl, codon]
    runs-on: ubuntu-latest
    # The slow_test run (full spec suites + slow apps) has unmeasured wall time; give it generous headroom and tighten later.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 60 || 300 }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - if: matrix.backend == 'ruby'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - if: matrix.backend == 'go'
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - if: matrix.backend == 'java'
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      # The runner's system perl satisfies the backend's floor (>= 5.26 with ivsize=8/nvsize=8); verify loudly up front instead of skipping.
      - if: matrix.backend == 'perl'
        run: perl -MConfig -e 'print "perl $] ivsize=$Config{ivsize} nvsize=$Config{nvsize}\n"; die "unsuitable system perl\n" unless $] >= 5.026 && $Config{ivsize} == 8 && $Config{nvsize} == 8'
      # ubuntu-24.04's system python 3.12.3 hits the static-block limit that breaks qjs-scale generated code, so pin >= 3.12.4 (#21).
      - if: matrix.backend == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      # Codon comes from the pinned upstream release; keep in sync with local dev (docs/backends/codon.md names the floor).
      - if: matrix.backend == 'codon'
        name: Install Codon
        run: |
          curl -fsSL --retry 5 -o /tmp/codon.tar.gz \
            https://github.com/exaloop/codon/releases/download/v0.20.1/codon-linux-x86_64.tar.gz
          echo "3fa970c476acf1056a2460e309ac41557956a1adf499e3e46e8db98ae78a2659  /tmp/codon.tar.gz" | shasum -a 256 -c -
          sudo tar -xzf /tmp/codon.tar.gz -C /opt
          echo "DEWASM_CODON=/opt/codon-deploy-linux-x86_64/bin/codon" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.backend }}
          # Only main writes the shared build cache; PRs restore it read-only to keep the repo under the 10 GB cache budget.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache/restore@v6
        with:
          path: examples/apps/cache
          key: ${{ needs.apps-cache.outputs.key }}
          fail-on-cache-miss: true
      # The cache-matches-its-pins test reproduces the stamps, which name these two tools' versions.
      - uses: ./.github/actions/apps-cache-tools
      - name: Test
        if: github.event_name == 'pull_request'
        run: cargo test -p dewasm-backend-${{ matrix.backend }} --no-fail-fast
      # Speed categories: the `slow_test` feature runs the full spec suite plus the slow per-case app cases (CI's main run).
      # It deliberately excludes the
      # `ultra_slow_test` cases, which run only locally: the ~1 min+ pty / giant-`go build` cases that timed out (#22) or exhausted runner memory (#23).
      - name: Test (slow)
        if: github.event_name != 'pull_request'
        run: cargo test -p dewasm-backend-${{ matrix.backend }} --no-fail-fast --features dewasm-backend-${{ matrix.backend }}/slow_test

  core:
    needs: apps-cache
    runs-on: ubuntu-latest
    # The slow_test run (full spec suites + slow apps) has unmeasured wall time; give it generous headroom and tighten later.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 60 || 300 }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # dewasm holds the cross-backend tests, so this job needs every backend toolchain (bash ships with the runner; python is pinned below because ubuntu-24.04's 3.12.3 breaks qjs-scale generated code, #21).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: core
          # Only main writes the shared build cache; PRs restore it read-only to keep the repo under the 10 GB cache budget.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/cache/restore@v6
        with:
          path: examples/apps/cache
          key: ${{ needs.apps-cache.outputs.key }}
          fail-on-cache-miss: true
      # The cache-matches-its-pins test reproduces the stamps, which name these two tools' versions.
      - uses: ./.github/actions/apps-cache-tools
      # Speed categories: the `slow_test` feature covers the slow cases.
      # `dewasm-test-helper/wasmtime_test` runs the apps_wasmtime snapshot-freshness suite, which execs the xtask binary (it embeds the pinned wasmtime crate, so nothing is installed for it) and never builds it, hence the explicit build step below; `dewasm/slow_test` runs the slow cross-backend `--data-file` real-app cases.
      - name: Build the snapshot runner
        if: github.event_name != 'pull_request'
        run: cargo build -p xtask
      - name: Test
        if: github.event_name == 'pull_request'
        run: cargo test -p dewasm-core -p dewasm-backend -p dewasm -p dewasm-test-helper -p xtask --no-fail-fast
      - name: Test (slow)
        if: github.event_name != 'pull_request'
        run: cargo test -p dewasm-core -p dewasm-backend -p dewasm -p dewasm-test-helper -p xtask --no-fail-fast --features dewasm/slow_test,dewasm-test-helper/wasmtime_test
