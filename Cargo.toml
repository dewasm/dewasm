[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Hiroya Fujinami <make.just.on@gmail.com>"]
repository = "https://github.com/dewasm/dewasm"

[workspace.dependencies]
dewasm-core = { path = "crates/dewasm-core" }
dewasm-backend = { path = "crates/dewasm-backend" }
dewasm-backend-ruby = { path = "crates/dewasm-backend-ruby" }
dewasm-backend-bash = { path = "crates/dewasm-backend-bash" }
dewasm-backend-python = { path = "crates/dewasm-backend-python" }
dewasm-backend-perl = { path = "crates/dewasm-backend-perl" }
dewasm-backend-go = { path = "crates/dewasm-backend-go" }
dewasm-backend-java = { path = "crates/dewasm-backend-java" }
dewasm-test-helper = { path = "crates/dewasm-test-helper" }
anyhow = "1"
wasmparser = "0.254"
# DWARF reader, core-only (backends never see it): parses `.debug_line` for
# the opt-in `--dwarf-line` source back-mapping. Read side only.
gimli = { version = "0.31", default-features = false, features = ["read", "std"] }
wat = "1"
wast = "254"
clap = { version = "4", features = ["derive"] }
regex = "1"
libtest-mimic = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The crates that compile a guest module inside the xtask snapshot runner.
# Unoptimized they take ~60 s over a 34 MB app rather than ~7 s, which the snapshot capture and the freshness suite pay on every heavy case; the runner itself stays on the plain dev profile the tests resolve it in.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmtime-environ]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
