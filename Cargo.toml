[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["TSUYUSATO Kitsune <make.just.on@gmail.com>"]

[workspace.dependencies]
dewasm-core = { path = "crates/dewasm-core" }
dewasm-backend = { path = "crates/dewasm-backend" }
dewasm-backend-ruby = { path = "crates/dewasm-backend-ruby" }
dewasm-backend-bash = { path = "crates/dewasm-backend-bash" }
dewasm-backend-python = { path = "crates/dewasm-backend-python" }
dewasm-backend-go = { path = "crates/dewasm-backend-go" }
dewasm-backend-java = { path = "crates/dewasm-backend-java" }
dewasm-test-helper = { path = "crates/dewasm-test-helper" }
anyhow = "1"
wasmparser = "0.254"
wat = "1"
wast = "254"
clap = { version = "4", features = ["derive"] }
regex = "1"
libtest-mimic = "0.8"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
