[package]
name = "dewasm-backend-bash"
description = "Bash backend for dewasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Opt-in: expands the heavy per-case macros (dewasm-test-helper, ADR-27
# revision) as active `#[test]`s instead of `#[ignore]`d ones. See
# docs/testing.md.
heavy_test = []

[dependencies]
anyhow.workspace = true
dewasm-core.workspace = true
dewasm-backend.workspace = true

[dev-dependencies]
regex.workspace = true
wast.workspace = true
dewasm-test-helper.workspace = true

# The spec integration test is a libtest-mimic harness: one trial per
# `.wast` file, so `harness = false` and its `main` comes from `spec_suite!`.
[[test]]
name = "spec"
harness = false
