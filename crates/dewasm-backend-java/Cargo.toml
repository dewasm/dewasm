[package]
name = "dewasm-backend-java"
description = "Java backend for dewasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Opt-in test speed categories (see docs/testing.md).
# `slow_test` expands the slow per-case macros (dewasm-test-helper) as active `#[test]`s.
# Without it they expand as `#[ignore]`d ones.
# `slow_test` also runs the full spec testsuite; it is CI's main run.
# `ultra_slow_test` also un-ignores the cases measured at ~1 min+ locally.
# Those are the zeroperl reactor cases: their ~99 MB generated source `javac`s for ~45 s.
# That holds even on a fast laptop.
# These cases are kept out of CI and run only in local pre-release verification.
slow_test = []
ultra_slow_test = ["slow_test"]

[dependencies]
anyhow.workspace = true
dewasm-core.workspace = true
dewasm-backend.workspace = true

[dev-dependencies]
regex.workspace = true
wast.workspace = true
wat.workspace = true
dewasm-test-helper.workspace = true

# The spec integration test is a libtest-mimic harness with one trial per `.wast` file.
# So `harness = false`, and its `main` comes from `spec_suite!`.
[[test]]
name = "spec"
harness = false

# The WASI-testsuite integration test is likewise a libtest-mimic harness.
# It has one trial per prebuilt `.wasm`, `harness = false`, and `main` from `wasi_testsuite_suite!`.
[[test]]
name = "wasi_testsuite"
harness = false

# The whole-cache convert suite is likewise a libtest-mimic harness.
# It has one trial per cached app, `harness = false`, and `main` from `apps_convert_suite!`.
[[test]]
name = "convert"
harness = false
