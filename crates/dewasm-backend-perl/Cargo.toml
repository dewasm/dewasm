[package]
name = "dewasm-backend-perl"
description = "Perl backend for dewasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Opt-in: expands the slow per-case macros (dewasm-test-helper, ADR-27
# revision) as active `#[test]`s instead of `#[ignore]`d ones, and runs the
# full spec testsuite run — CI's main run tier. See docs/testing.md.
slow_test = []
# The ultra tier (ADR-48): cases measured at ~1 minute or more on a CI
# runner (the CRuby-hello run, ~57s locally), kept out of CI and run only
# in local pre-release verification.
ultra_slow_test = ["slow_test"]

[dependencies]
anyhow.workspace = true
dewasm-core.workspace = true
dewasm-backend.workspace = true

[dev-dependencies]
regex.workspace = true
wast.workspace = true
wat.workspace = true
dewasm-test-helper.workspace = true

# The spec integration test is a libtest-mimic harness: one trial per
# `.wast` file, so `harness = false` and its `main` comes from `spec_suite!`.
[[test]]
name = "spec"
harness = false

# The WASI-testsuite integration test (ADR-36) is likewise a
# libtest-mimic harness: one trial per prebuilt `.wasm`, `harness = false`,
# `main` from `wasi_testsuite_suite!`.
[[test]]
name = "wasi_testsuite"
harness = false

# The whole-cache convert suite (ADR-54) is likewise a libtest-mimic
# harness: one trial per cached app, `harness = false`, `main` from
# `apps_convert_suite!`.
[[test]]
name = "convert"
harness = false
