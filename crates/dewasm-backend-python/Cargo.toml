[package]
name = "dewasm-backend-python"
description = "Python backend for dewasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Optional test speed categories (see `docs/testing.md`).
# `slow_test` expands the slow per-case macros (dewasm-test-helper) as active `#[test]`s.
# Without it they are `#[ignore]`d.
# `slow_test` also runs the full specification testsuite (CI's main run).
# `ultra_slow_test` additionally un-ignores the cases kept out of CI.
# One is the packed-CRuby case: its host-CPython compile peaks at ~12 GB.
# It OOMs the runner next to the other memory-heavy cases (issue #126).
# `ultra_slow_test` runs only in local pre-release verification.
slow_test = []
ultra_slow_test = ["slow_test"]

[dependencies]
anyhow.workspace = true
dewasm-core.workspace = true
dewasm-backend.workspace = true

[dev-dependencies]
regex.workspace = true
wast.workspace = true
wat.workspace = true
dewasm-test-helper.workspace = true

# The `spec` integration test is a `libtest-mimic` harness with one trial per `.wast` file.
# So `harness = false`, and its `main` comes from `spec_suite!`.
[[test]]
name = "spec"
harness = false

# The WASI-testsuite integration test is likewise a `libtest-mimic` harness.
# It runs one trial per prebuilt `.wasm`.
# It sets `harness = false`, and its `main` comes from `wasi_testsuite_suite!`.
[[test]]
name = "wasi_testsuite"
harness = false

# The whole-cache convert suite is likewise a `libtest-mimic` harness.
# It runs one trial per cached app.
# It sets `harness = false`, and its `main` comes from `apps_convert_suite!`.
[[test]]
name = "convert"
harness = false
