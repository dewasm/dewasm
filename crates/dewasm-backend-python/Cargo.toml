[package]
name = "dewasm-backend-python"
description = "Python backend for dewasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Opt-in test speed categories (see docs/testing.md).
# `slow_test` expands the slow per-case macros (dewasm-test-helper) as active `#[test]`s instead of `#[ignore]`d ones and runs the full spec testsuite (CI's main run).
# `ultra_slow_test` additionally un-ignores the cases kept out of CI (the packed-CRuby case, whose host-CPython compile peaks at ~12 GB and
# OOMs the runner next to the other giants, issue #126); run only in local pre-release verification.
slow_test = []
ultra_slow_test = ["slow_test"]

[dependencies]
anyhow.workspace = true
dewasm-core.workspace = true
dewasm-backend.workspace = true

[dev-dependencies]
regex.workspace = true
wast.workspace = true
wat.workspace = true
dewasm-test-helper.workspace = true

# The spec integration test is a libtest-mimic harness: one trial per
# `.wast` file, so `harness = false` and its `main` comes from `spec_suite!`.
[[test]]
name = "spec"
harness = false

# The WASI-testsuite integration test is likewise a libtest-mimic harness: one trial per prebuilt `.wasm`, `harness = false`,
# `main` from `wasi_testsuite_suite!`.
[[test]]
name = "wasi_testsuite"
harness = false

# The whole-cache convert suite is likewise a libtest-mimic harness: one trial per cached app, `harness = false`, `main` from
# `apps_convert_suite!`.
[[test]]
name = "convert"
harness = false
