[package]
name = "dewasm-cli"
description = "dewasm: translate WebAssembly binaries into source code of various languages"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
name = "dewasm_cli"
path = "src/lib.rs"

[[bin]]
name = "dewasm"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
wat.workspace = true
dewasm-core.workspace = true
dewasm-backend.workspace = true
dewasm-backend-ruby.workspace = true
dewasm-backend-bash.workspace = true
dewasm-backend-python.workspace = true
dewasm-backend-go.workspace = true
dewasm-backend-java.workspace = true
