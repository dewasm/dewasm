[package]
name = "dewasm-cli"
description = "dewasm: translate WebAssembly binaries into source code of various languages"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Opt-in: expands the slow cross-backend `--data-file` real-app cases (tests/data_file.rs — convert + run/build the cached qjs.wasm) as active `#[test]`s instead of `#[ignore]`d ones. CI's main run; see docs/testing.md.
slow_test = []

[lib]
name = "dewasm_cli"
path = "src/lib.rs"

[[bin]]
name = "dewasm"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
wat.workspace = true
dewasm-core.workspace = true
dewasm-backend.workspace = true
dewasm-backend-ruby.workspace = true
dewasm-backend-bash.workspace = true
dewasm-backend-python.workspace = true
dewasm-backend-perl.workspace = true
dewasm-backend-go.workspace = true
dewasm-backend-java.workspace = true
