[package]
name = "dewasm-test-helper"
description = "Shared test harness, case tables, and per-feature test macros for the dewasm backend crates"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Test-only support code, never published.
publish = false

[lints]
workspace = true

[features]
# Optional: enables the Wasmtime snapshot-freshness suite (`tests/apps_wasmtime.rs`).
# It needs a real `wasmtime` install, which is kept out of the default suite's required tools.
# See `docs/testing.md`.
wasmtime_test = []

[dependencies]
anyhow.workspace = true
wast.workspace = true
wat.workspace = true
dewasm-core.workspace = true
dewasm-backend.workspace = true
libtest-mimic.workspace = true
# Test-only manifest parsing for the WASI-testsuite harness.
# This crate never ships (`publish = false`).
# So a JSON dependency here has no shipped-artifact impact.
serde.workspace = true
serde_json.workspace = true
# Real pseudo-terminal pair for the interactive-REPL transcript tests.
# The `qjs` REPL only enters its interactive line-editing path when `stdin` is a TTY.
# So proving it byte-identical to `wasmtime` needs a genuine pseudo-terminal, not a pipe.
# It is a plain dependency, not a `[dev-dependencies]` one.
# That is fine: this whole crate is test-only (`publish = false`).
# The backend crates' `tests/` consume its modules as normal library code.
portable-pty = "0.9"
