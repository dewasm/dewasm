[package]
name = "dewasm-test-helper"
description = "Shared test harness, case tables, and per-feature test macros for the dewasm backend crates"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Test-only support code, never published.
publish = false

[lints]
workspace = true

[features]
# Opt-in: gates the wasmtime golden-freshness suite (tests/apps_wasmtime.rs),
# which needs a real `wasmtime` install (ADR-15 keeps the default suite free of
# that dependency). See docs/testing.md.
wasmtime_test = []

[dependencies]
anyhow.workspace = true
wast.workspace = true
wat.workspace = true
dewasm-core.workspace = true
dewasm-backend.workspace = true
libtest-mimic.workspace = true
# Test-only manifest parsing for the WASI-testsuite harness (ADR-36). This
# crate never ships (`publish = false`), so a JSON dependency here has no
# shipped-artifact impact.
serde.workspace = true
serde_json.workspace = true
# Real pty pair for the interactive-REPL transcript tests (Fix 4): the qjs
# REPL only enters its interactive line-editing path when stdin is a tty, so
# proving it byte-identical to wasmtime needs a genuine pty, not a pipe. A
# plain (non-dev) dependency is fine — this whole crate is test-only
# (`publish = false`) and its modules are consumed as normal library code by
# the backend crates' `tests/`.
portable-pty = "0.9"
