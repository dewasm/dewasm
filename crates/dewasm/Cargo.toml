[package]
name = "dewasm"
description = "dewasm: translate WebAssembly binaries into source code of various languages"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Optional: expands the slow cross-backend `--data-file` real-app cases as active `#[test]`s.
# Without it they are `#[ignore]`d.
# They live in tests/data_file.rs and convert and run or build the cached qjs.wasm.
# CI's main run; see `docs/testing.md`.
slow_test = []

[dependencies]
anyhow.workspace = true
clap.workspace = true
wat.workspace = true
dewasm-core.workspace = true
dewasm-backend.workspace = true
dewasm-backend-ruby.workspace = true
dewasm-backend-bash.workspace = true
dewasm-backend-python.workspace = true
dewasm-backend-codon.workspace = true
dewasm-backend-perl.workspace = true
dewasm-backend-go.workspace = true
dewasm-backend-java.workspace = true
