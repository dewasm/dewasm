[package]
name = "xtask"
description = "Developer-facing workspace tasks run via `cargo xtask`; each command lives in an `xtask-*` crate"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
xtask-feature-audit.workspace = true
xtask-records.workspace = true
xtask-snapshot.workspace = true
xtask-support-docs.workspace = true
xtask-text-check.workspace = true
