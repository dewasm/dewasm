[package]
name = "xtask"
description = "Developer-facing workspace tasks (snapshot-file regeneration, the benchmark suite) run via `cargo xtask`"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Dev tooling, never published.
publish = false

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
dewasm-cli = { path = "../dewasm-cli" }
dewasm-test-helper.workspace = true
# `bench` drives every backend directly through the `Backend` trait (never by
# shelling out to the `dewasm` binary) and reuses each backend crate's own
# `find_*` toolchain locator for the runner-availability probes. `dewasm-cli`
# already pulls all of them in, so this adds no workspace member.
dewasm-core.workspace = true
dewasm-backend.workspace = true
dewasm-backend-ruby.workspace = true
dewasm-backend-bash.workspace = true
dewasm-backend-python.workspace = true
dewasm-backend-perl.workspace = true
dewasm-backend-go.workspace = true
dewasm-backend-java.workspace = true
# The benchmark suite's machine-readable result file. Timings are not
# reproducible byte-for-byte, so this is a data drop, not a compared snapshot.
serde.workspace = true
serde_json.workspace = true
# Encodes the human-facing PNG sidecar of the DOOM frame snapshot; default
# settings kept fixed so regeneration is byte-stable.
png = "0.18.1"
# std makes `wasmtime::Error` an `anyhow::Error` (so `?` composes with our
# anyhow flow); cranelift+runtime is the embedder. No wasi/component/gc: the
# DOOM oracle only instantiates a baseline module and calls exports.
wasmtime = { version = "47.0.2", default-features = false, features = ["cranelift", "runtime", "std"] }
