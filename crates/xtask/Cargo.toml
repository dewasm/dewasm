[package]
name = "xtask"
description = "Developer-facing workspace tasks (snapshot-file regeneration, the benchmark suite) run via `cargo xtask`"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
dewasm-test-helper.workspace = true
# `bench` and `support_docs` drive every backend directly through the `Backend` trait.
# They never shell out to the `dewasm` binary.
# `bench` also reuses each backend crate's own `find_*` toolchain locator.
# The runner-availability probes use it.
dewasm-core.workspace = true
dewasm-backend.workspace = true
dewasm-backend-ruby.workspace = true
dewasm-backend-bash.workspace = true
dewasm-backend-python.workspace = true
dewasm-backend-perl.workspace = true
dewasm-backend-go.workspace = true
dewasm-backend-java.workspace = true
dewasm-backend-codon.workspace = true
# The benchmark suite's machine-readable result file.
# Timings are not reproducible byte-for-byte, so this is a data drop, not a compared snapshot.
serde.workspace = true
# float_roundtrip: migrate-records re-parses and re-serializes stored measurements.
# The default parser can drift a value's last ulp.
serde_json = { workspace = true, features = ["float_roundtrip"] }
# `feature-audit` validates candidate app binaries against raw feature bits.
# It can then name proposals the converter itself no longer models.
wasmparser.workspace = true
# Encodes the human-facing PNG of the DOOM frame snapshot.
# Default settings are kept fixed so regeneration is byte-stable.
png = "0.18.1"
# `check-prose` counts the characters a reader sees in Markdown, which takes a CommonMark parser.
pulldown-cmark = { version = "0.13", default-features = false }
# std makes `wasmtime::Error` an `anyhow::Error`, so `?` composes with our anyhow flow.
# cranelift+runtime is the embedder.
# gc is what compiles in the exception-handling proposal.
# wasmtime implements exnref on its GC machinery.
# gc-drc is the collector wasmtime defaults to.
# mruby's snapshots need both, and without gc `Config::wasm_exceptions` does not exist.
wasmtime = { version = "47.0.2", default-features = false, features = ["cranelift", "gc", "gc-drc", "runtime", "std", "parallel-compilation"] }
# WASI p1 for the `test-wasmtime-wasi` runner.
# The version tracks `wasmtime` exactly: every snapshot is captured through this crate.
# So the pin is what makes regeneration reproducible across hosts.
wasmtime-wasi = { version = "47.0.2", default-features = false, features = ["p1"] }
